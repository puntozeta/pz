<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- =====================================
       INFORMACIÓN GENERAL
       ===================================== -->

  <title>El Reloj Sibarita</title>

  <meta
    name="description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo. PUNTOZETA SOLUCIONES DIGITALES"
  >


  <!-- =====================================
       OPEN GRAPH
       ===================================== -->

  <meta
    property="og:title"
    content="El Reloj Sibarita"
  >

  <meta
    property="og:description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo. PUNTOZETA SOLUCIONES DIGITALES"
  >

  <meta
    property="og:image"
    content="https://puntozetasd.wordpress.com/wp-content/uploads/2025/04/sumatrapdf_ooyrdgptzp.png"
  >

  <meta
    property="og:image:alt"
    content="Catálogo de El Reloj Sibarita"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://puntozeta.github.io/pz/elreloj/"
  >


  <!-- =====================================
       TWITTER / X
       ===================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="El Reloj Sibarita"
  >

  <meta
    name="twitter:description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo."
  >

  <meta
    name="twitter:image"
    content="https://puntozetasd.wordpress.com/wp-content/uploads/2025/04/sumatrapdf_ooyrdgptzp.png"
  >


  <!-- =====================================
       FAVICON
       ===================================== -->

  <link
    rel="icon"
    type="image/png"
    href="./assets/elrelojlogo.png"
  >


  <meta
    name="theme-color"
    content="#111111"
  >


  <!-- =====================================
       ESTILOS
       ===================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;

      height: 100%;

      background: #1f1f1f;

      overflow: hidden;

    }


    body {

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    }


    /*
      El visor ocupa prácticamente
      toda la pantalla disponible.
    */

    #pdf-viewer {

      width: 100%;

      height: 100vh;
      height: 100dvh;

    }


    /*
      Fallback por si JavaScript tarda
      unos instantes en inicializar.
    */

    .loading {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #1f1f1f;

      color: #fff;

      font-size: 14px;

      z-index: -1;

    }

  </style>

</head>


<body>


  <!-- =====================================
       FALLBACK DE CARGA
       ===================================== -->

  <div class="loading">
    Cargando catálogo...
  </div>


  <!-- =====================================
       VISOR
       ===================================== -->

  <div id="pdf-viewer"></div>


  <!-- =====================================
       EMBEDPDF
       ===================================== -->
<script type="module">

  import EmbedPDF, { ZoomMode } from
    "https://cdn.jsdelivr.net/npm/@embedpdf/snippet@2.15.1/dist/embedpdf.js";


  const viewer = EmbedPDF.init({

    type: "container",

    target:
      document.getElementById(
        "pdf-viewer"
      ),

    src: "./elreloj.pdf",


    /* =====================================
       SOLO UN DOCUMENTO
       ===================================== */

    tabBar: "never",


    /* =====================================
       TEMA
       ===================================== */

    theme: {
      preference: "dark"
    },


    /* =====================================
       VISUALIZACIÓN
       ===================================== */

    zoom: {

      defaultZoomLevel:
        ZoomMode.FitWidth,

      minZoom: 0.5,

      maxZoom: 3

    },


    /* =====================================
       NAVEGACIÓN
       ===================================== */

    scroll: {

      defaultStrategy: "vertical",

      defaultPageGap: 10

    },


    /* =====================================
       OCULTAR HERRAMIENTAS
       SIN DESACTIVAR LOS LINKS
       ===================================== */

    disabledCategories: [

      /*
        IMPORTANTE:

        NO incluir:
        "annotation"

        porque desactivaría también
        la interacción de las anotaciones
        del PDF.
      */


      /* Marcadores */

      "annotation-markup",

      "annotation-highlight",

      "annotation-underline",

      "annotation-strikeout",

      "annotation-squiggly",


      /* Dibujar */

      "annotation-ink",


      /* Texto y notas */

      "annotation-text",


      /* Sellos */

      "annotation-stamp",


      /* Formas */

      "annotation-shape",

      "annotation-rectangle",

      "annotation-circle",

      "annotation-line",

      "annotation-arrow",

      "annotation-polygon",

      "annotation-polyline",


      /* Formularios */

      "form",


      /* Redacción */

      "redaction",


      /* Insertar elementos */

      "insert",


      /* Historial */

      "history",


      /* Paneles laterales */

      "panel",


      /* Vista doble */

      "spread",


      /* Rotación */

      "rotate",


      /* Captura */

      "capture",


      /* Abrir otro PDF */

      "document-open",


      /* Cerrar documento */

      "document-close",


      /* Imprimir */

      "document-print",


      /* Descargar / exportar */

      "document-export",


      /* Protección */

      "document-protect",


      /* Captura de documento */

      "document-capture",


      /* UI de seguridad */

      "security",


      /*
        Quitamos solamente zoom avanzado.

        NO quitamos completamente "zoom"
        porque queremos conservar pinch,
        ctrl + rueda, etc.
      */

      "zoom-marquee"

    ]

  });


  viewer.registry
    .then(registry => {

      console.log(
        "Visor listo"
      );


      /*
        Dejamos el sistema de anotaciones
        en modo cursor/selección normal.

        Esto es importante para permitir
        interacción con links existentes.
      */

      const annotationPlugin =
        registry
          .getPlugin("annotation")
          ?.provides();


      if (annotationPlugin) {

        annotationPlugin.setActiveTool(
          null
        );

      }

    })
    .catch(error => {

      console.error(
        "Error iniciando EmbedPDF:",
        error
      );

    });

</script>


</body>

</html>
