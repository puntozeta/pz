<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- =====================================
       INFORMACIÓN GENERAL
       ===================================== -->

  <title>El Reloj Sibarita</title>

  <meta
    name="description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo. PUNTOZETA SOLUCIONES DIGITALES"
  >


  <!-- =====================================
       OPEN GRAPH
       ===================================== -->

  <meta
    property="og:title"
    content="El Reloj Sibarita"
  >

  <meta
    property="og:description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo. PUNTOZETA SOLUCIONES DIGITALES"
  >

  <meta
    property="og:image"
    content="https://puntozetasd.wordpress.com/wp-content/uploads/2025/04/sumatrapdf_ooyrdgptzp.png"
  >

  <meta
    property="og:image:alt"
    content="Catálogo de El Reloj Sibarita"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://puntozeta.github.io/pz/elreloj/"
  >


  <!-- =====================================
       TWITTER / X
       ===================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="El Reloj Sibarita"
  >

  <meta
    name="twitter:description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo."
  >

  <meta
    name="twitter:image"
    content="https://puntozetasd.wordpress.com/wp-content/uploads/2025/04/sumatrapdf_ooyrdgptzp.png"
  >


  <!-- =====================================
       FAVICON
       ===================================== -->

  <link
    rel="icon"
    type="image/png"
    href="./assets/elrelojlogo.png"
  >


  <meta
    name="theme-color"
    content="#111111"
  >


  <!-- =====================================
       ESTILOS
       ===================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;

      height: 100%;

      background: #1f1f1f;

      overflow: hidden;

    }


    body {

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    }


    /*
      El visor ocupa prácticamente
      toda la pantalla disponible.
    */

    #pdf-viewer {

      width: 100%;

      height: 100vh;
      height: 100dvh;

    }


    /*
      Fallback por si JavaScript tarda
      unos instantes en inicializar.
    */

    .loading {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #1f1f1f;

      color: #fff;

      font-size: 14px;

      z-index: -1;

    }

  </style>

</head>


<body>


  <!-- =====================================
       FALLBACK DE CARGA
       ===================================== -->

  <div class="loading">
    Cargando catálogo...
  </div>


  <!-- =====================================
       VISOR
       ===================================== -->

  <div id="pdf-viewer"></div>


  <!-- =====================================
       EMBEDPDF
       ===================================== -->

  <script type="module">

  import EmbedPDF, { ZoomMode } from
    "https://cdn.jsdelivr.net/npm/@embedpdf/snippet@2/dist/embedpdf.js";


  const viewer = EmbedPDF.init({

    type: "container",

    target: document.getElementById(
      "pdf-viewer"
    ),

    src: "./elreloj.pdf",


    /* =====================================
       SOLO UN DOCUMENTO
       ===================================== */

    tabBar: "never",


    /* =====================================
       TEMA
       ===================================== */

    theme: {
      preference: "dark"
    },


    /* =====================================
       VISUALIZACIÓN
       ===================================== */

    zoom: {

      /*
        Muestra la página completa
        aprovechando el espacio disponible.
      */

      defaultZoomLevel:
        ZoomMode.FitPage,

      minZoom: 0.5,

      maxZoom: 3

    },


    /* =====================================
       NAVEGACIÓN
       ===================================== */

    scroll: {

      /*
        Permite recorrer normalmente
        las páginas del catálogo.
      */

      defaultStrategy: "vertical",

      defaultPageGap: 10

    },


    /* =====================================
       PERMISOS
       ===================================== */

    permissions: {

      overrides: {

        /*
          El usuario solamente visualiza.
        */

        print: false,

        printHighQuality: false,

        modifyContents: false,

        modifyAnnotations: false,

        fillForms: false

      }

    },


    /* =====================================
       OCULTAR HERRAMIENTAS INNECESARIAS
       ===================================== */

    disabledCategories: [

      /* Edición / anotaciones */
      "annotation",

      /* Formularios */
      "form",

      /* Redacción */
      "redaction",

      /* Insertar contenido */
      "insert",

      /* Historial de edición */
      "history",

      /* Paneles laterales */
      "panel",

      /* Diseños múltiples */
      "spread",

      /* Rotación */
      "rotate",

      /* Capturas */
      "capture",

      /* Impresión */
      "document-print",

      /* Exportar / descargar */
      "document-export",

      /* Abrir otro PDF */
      "document-open",

      /* Cerrar documento */
      "document-close",

      /* Protección */
      "document-protect",

      /* Captura de documento */
      "document-capture",

      /* UI de seguridad */
      "security",

      /*
        Quitamos las opciones avanzadas
        de zoom de la toolbar.

        El PDF sigue iniciando en FitPage.
      */

      "zoom",

      /*
        NO ponemos:

        "navigation"
        "scroll"
        "page"

        porque esas son precisamente
        las funciones que queremos conservar.
      */

    ]

  });


  viewer.registry
    .then(() => {

      console.log(
        "Visor de catálogo listo"
      );

    })
    .catch(error => {

      console.error(
        "Error iniciando EmbedPDF:",
        error
      );

    });

</script>


</body>

</html>
