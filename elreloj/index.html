<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- Información general -->
  <title>El Reloj Sibarita</title>

  <meta
    name="description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo. PUNTOZETA SOLUCIONES DIGITALES"
  >

  <!-- Open Graph -->
  <meta
    property="og:title"
    content="El Reloj Sibarita"
  >

  <meta
    property="og:description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo. PUNTOZETA SOLUCIONES DIGITALES"
  >

  <meta
    property="og:image"
    content="https://puntozetasd.wordpress.com/wp-content/uploads/2025/04/sumatrapdf_ooyrdgptzp.png"
  >

  <meta
    property="og:image:alt"
    content="Catálogo de El Reloj Sibarita"
  >

  <meta
    property="og:type"
    content="website"
  >

  <!-- URL pública del catálogo -->
  <meta
    property="og:url"
    content="https://TU-USUARIO.github.io/TU-REPOSITORIO/"
  >

  <!-- Twitter / X -->
  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="El Reloj Sibarita"
  >

  <meta
    name="twitter:description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo."
  >

  <meta
    name="twitter:image"
    content="https://puntozetasd.wordpress.com/wp-content/uploads/2025/04/sumatrapdf_ooyrdgptzp.png"
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="./assets/elrelojlogo.png"
  >

  <!-- Color del navegador móvil -->
  <meta
    name="theme-color"
    content="#111111"
  >

  <style>
    :root {
      --toolbar-height: 58px;
      --bg: #252525;
      --toolbar: #111111;
      --toolbar-border: rgba(255,255,255,.08);
      --text: #ffffff;
      --muted: #b5b5b5;
      --button-hover: rgba(255,255,255,.1);
      --button-active: rgba(255,255,255,.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      color: var(--text);
    }

    /* =========================
       TOOLBAR
       ========================= */

    .toolbar {
      height: var(--toolbar-height);

      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;

      padding:
        0 max(10px, env(safe-area-inset-right))
        0 max(10px, env(safe-area-inset-left));

      background: var(--toolbar);
      border-bottom: 1px solid var(--toolbar-border);

      user-select: none;
      position: relative;
      z-index: 100;
    }

    .toolbar-left,
    .toolbar-center,
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .toolbar-center {
      justify-content: center;
    }

    .toolbar-right {
      justify-content: flex-end;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;

      min-width: 0;
      padding-right: 8px;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* =========================
       BOTONES
       ========================= */

    .icon-button {
      width: 42px;
      height: 42px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border: 0;
      border-radius: 9px;

      background: transparent;
      color: var(--text);

      cursor: pointer;

      transition:
        background .15s ease,
        opacity .15s ease;
    }

    .icon-button:hover {
      background: var(--button-hover);
    }

    .icon-button:active {
      background: var(--button-active);
    }

    .icon-button:disabled {
      opacity: .3;
      cursor: default;
      background: transparent;
    }

    .icon-button svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* =========================
       NUMERO DE PÁGINA
       ========================= */

    .page-control {
      display: flex;
      align-items: center;
      gap: 6px;

      margin: 0 5px;

      font-size: 13px;
      color: var(--muted);
    }

    .page-input {
      width: 44px;
      height: 32px;

      padding: 0 5px;

      border: 1px solid rgba(255,255,255,.13);
      border-radius: 6px;

      background: rgba(255,255,255,.07);
      color: white;

      text-align: center;
      font-size: 13px;

      outline: none;

      appearance: textfield;
      -moz-appearance: textfield;
    }

    .page-input::-webkit-inner-spin-button,
    .page-input::-webkit-outer-spin-button {
      display: none;
    }

    .page-input:focus {
      border-color: rgba(255,255,255,.35);
    }

    .page-total {
      white-space: nowrap;
    }

    /* =========================
       VISOR
       ========================= */

    .viewer {
      position: relative;

      width: 100%;
      height: calc(100dvh - var(--toolbar-height));

      overflow: auto;

      display: flex;
      justify-content: center;
      align-items: flex-start;

      background:
        radial-gradient(
          circle at center,
          #353535 0%,
          #292929 70%
        );

      overscroll-behavior: contain;
      scrollbar-width: thin;
    }

    .canvas-wrapper {
      min-width: 100%;
      min-height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 14px;
    }

    #pdfCanvas {
      display: block;

      background: white;

      box-shadow:
        0 8px 30px rgba(0,0,0,.3);

      transition: opacity .12s ease;
    }

    #pdfCanvas.loading {
      opacity: .25;
    }

    /* =========================
       CARGA
       ========================= */

    .loading {
      position: absolute;

      left: 50%;
      top: 50%;

      transform: translate(-50%, -50%);

      z-index: 20;

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 13px;

      color: white;

      font-size: 13px;
    }

    .spinner {
      width: 34px;
      height: 34px;

      border: 3px solid rgba(255,255,255,.18);
      border-top-color: white;

      border-radius: 50%;

      animation: spin .75s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       ERROR
       ========================= */

    .error {
      position: absolute;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      width: min(420px, calc(100% - 40px));

      text-align: center;

      color: white;
    }

    .error h2 {
      margin: 0 0 8px;
      font-size: 18px;
    }

    .error p {
      margin: 0;
      color: #bbb;
      font-size: 14px;
      line-height: 1.5;
    }

    /* =========================
       INDICADOR ZOOM
       ========================= */

    .zoom-label {
      min-width: 52px;

      text-align: center;

      color: var(--muted);

      font-size: 12px;
    }

    /* =========================
       MÓVIL
       ========================= */

    @media (max-width: 700px) {

      :root {
        --toolbar-height: 54px;
      }

      .toolbar {
        grid-template-columns: auto 1fr auto;
        padding-left: 4px;
        padding-right: 4px;
      }

      .brand-name {
        display: none;
      }

      .toolbar-center {
        justify-content: center;
      }

      .icon-button {
        width: 40px;
        height: 40px;
      }

      .zoom-label {
        display: none;
      }

      .zoom-control {
        display: none;
      }

      .canvas-wrapper {
        padding: 5px;
      }
    }

    /* Teléfonos muy pequeños */

    @media (max-width: 390px) {

      .fullscreen-button {
        display: none;
      }

      .page-control {
        margin: 0;
      }

      .page-input {
        width: 38px;
      }
    }
  </style>
</head>

<body>

  <!-- ===============================
       BARRA DE HERRAMIENTAS
       =============================== -->

  <header class="toolbar">

    <div class="toolbar-left">

      <div class="brand">
        <span class="brand-name">
          Catálogo
        </span>
      </div>

    </div>


    <div class="toolbar-center">

      <!-- Página anterior -->

      <button
        id="prevButton"
        class="icon-button"
        aria-label="Página anterior"
        title="Página anterior"
      >

        <svg viewBox="0 0 24 24">
          <path d="M15 18l-6-6 6-6"/>
        </svg>

      </button>


      <!-- Número de página -->

      <div class="page-control">

        <input
          id="pageInput"
          class="page-input"
          type="number"
          value="1"
          min="1"
          aria-label="Número de página"
        >

        <span class="page-total">
          / <span id="pageCount">--</span>
        </span>

      </div>


      <!-- Página siguiente -->

      <button
        id="nextButton"
        class="icon-button"
        aria-label="Página siguiente"
        title="Página siguiente"
      >

        <svg viewBox="0 0 24 24">
          <path d="M9 18l6-6-6-6"/>
        </svg>

      </button>

    </div>


    <div class="toolbar-right">

      <!-- Alejar -->

      <button
        id="zoomOutButton"
        class="icon-button zoom-control"
        aria-label="Alejar"
        title="Alejar"
      >

        <svg viewBox="0 0 24 24">
          <path d="M5 12h14"/>
        </svg>

      </button>


      <span
        id="zoomLabel"
        class="zoom-label"
      >
        Ajustar
      </span>


      <!-- Acercar -->

      <button
        id="zoomInButton"
        class="icon-button zoom-control"
        aria-label="Acercar"
        title="Acercar"
      >

        <svg viewBox="0 0 24 24">
          <path d="M12 5v14"/>
          <path d="M5 12h14"/>
        </svg>

      </button>


      <!-- Ajustar a pantalla -->

      <button
        id="fitButton"
        class="icon-button"
        aria-label="Ajustar a pantalla"
        title="Ajustar a pantalla"
      >

        <svg viewBox="0 0 24 24">
          <path d="M8 3H3v5"/>
          <path d="M16 3h5v5"/>
          <path d="M8 21H3v-5"/>
          <path d="M16 21h5v-5"/>
        </svg>

      </button>


      <!-- Pantalla completa -->

      <button
        id="fullscreenButton"
        class="icon-button fullscreen-button"
        aria-label="Pantalla completa"
        title="Pantalla completa"
      >

        <svg viewBox="0 0 24 24">
          <path d="M8 3H3v5"/>
          <path d="M16 3h5v5"/>
          <path d="M8 21H3v-5"/>
          <path d="M16 21h5v-5"/>
        </svg>

      </button>

    </div>

  </header>


  <!-- ===============================
       VISOR
       =============================== -->

  <main
    id="viewer"
    class="viewer"
  >

    <div class="canvas-wrapper">

      <canvas id="pdfCanvas"></canvas>

    </div>


    <!-- Cargando -->

    <div
      id="loading"
      class="loading"
    >

      <div class="spinner"></div>

      <span>
        Cargando catálogo...
      </span>

    </div>


    <!-- Error -->

    <div
      id="error"
      class="error hidden"
    >

      <h2>
        No se pudo cargar el catálogo
      </h2>

      <p>
        Comprueba que el archivo PDF exista y que la conexión
        a Internet esté disponible.
      </p>

    </div>

  </main>


  <!-- ===============================
       PDF.JS
       =============================== -->

  <script type="module">

    import * as pdfjsLib from
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.mjs";


    /* =====================================
       CONFIGURACIÓN
       ===================================== */

    const PDF_URL = new URL("./elreloj.pdf", document.baseURI).href;

console.log("URL del PDF:", PDF_URL);


    /* =====================================
       ELEMENTOS
       ===================================== */

    const viewer =
      document.getElementById("viewer");

    const canvas =
      document.getElementById("pdfCanvas");

    const context =
      canvas.getContext("2d");

    const loading =
      document.getElementById("loading");

    const error =
      document.getElementById("error");

    const pageInput =
      document.getElementById("pageInput");

    const pageCount =
      document.getElementById("pageCount");

    const prevButton =
      document.getElementById("prevButton");

    const nextButton =
      document.getElementById("nextButton");

    const zoomInButton =
      document.getElementById("zoomInButton");

    const zoomOutButton =
      document.getElementById("zoomOutButton");

    const zoomLabel =
      document.getElementById("zoomLabel");

    const fitButton =
      document.getElementById("fitButton");

    const fullscreenButton =
      document.getElementById("fullscreenButton");


    /* =====================================
       ESTADO
       ===================================== */

    let pdf = null;

    let currentPage = 1;

    /*
      zoom = 1 significa:
      utilizar tamaño automático.
    */

    let zoom = 1;

    let renderTask = null;

    let resizeTimer = null;


    /* =====================================
       CALCULAR ESCALA AUTOMÁTICA
       ===================================== */

    function getFitScale(page) {

      const viewport =
        page.getViewport({
          scale: 1
        });


      /*
        Dejamos unos pocos píxeles para
        evitar barras de desplazamiento
        innecesarias.
      */

      const availableWidth =
        viewer.clientWidth - 12;

      const availableHeight =
        viewer.clientHeight - 12;


      const widthScale =
        availableWidth / viewport.width;

      const heightScale =
        availableHeight / viewport.height;


      /*
        La página completa cabe dentro
        de la pantalla.
      */

      return Math.min(
        widthScale,
        heightScale
      );
    }


    /* =====================================
       RENDERIZAR PÁGINA
       ===================================== */

    async function renderPage() {

      if (!pdf)
        return;


      try {

        canvas.classList.add("loading");


        /*
          Cancelamos un render anterior
          si el usuario cambia rápidamente
          de página.
        */

        if (renderTask) {

          try {
            renderTask.cancel();
          } catch (_) {}

        }


        const page =
          await pdf.getPage(currentPage);


        const fitScale =
          getFitScale(page);


        const finalScale =
          fitScale * zoom;


        const viewport =
          page.getViewport({
            scale: finalScale
          });


        /*
          Mejora mucho la nitidez en
          pantallas Retina / móviles.
        */

        const pixelRatio =
          window.devicePixelRatio || 1;


        canvas.width =
          Math.floor(
            viewport.width * pixelRatio
          );


        canvas.height =
          Math.floor(
            viewport.height * pixelRatio
          );


        canvas.style.width =
          `${Math.floor(viewport.width)}px`;


        canvas.style.height =
          `${Math.floor(viewport.height)}px`;


        const transform =
          pixelRatio !== 1
            ? [
                pixelRatio,
                0,
                0,
                pixelRatio,
                0,
                0
              ]
            : null;


        renderTask =
          page.render({

            canvasContext: context,

            viewport,

            transform

          });


        await renderTask.promise;


        canvas.classList.remove("loading");


        pageInput.value =
          currentPage;


        updateControls();


      } catch (err) {

        /*
          Ignoramos cancelaciones normales
          al cambiar rápidamente de página.
        */

        if (
          err?.name ===
          "RenderingCancelledException"
        ) {
          return;
        }


        console.error(err);

      }

    }


    /* =====================================
       CONTROLES
       ===================================== */

    function updateControls() {

      if (!pdf)
        return;


      prevButton.disabled =
        currentPage <= 1;


      nextButton.disabled =
        currentPage >= pdf.numPages;


      pageInput.max =
        pdf.numPages;


      if (zoom === 1) {

        zoomLabel.textContent =
          "Ajustar";

      } else {

        zoomLabel.textContent =
          `${Math.round(zoom * 100)}%`;

      }

    }


    function goToPage(pageNumber) {

      if (!pdf)
        return;


      const page =
        Math.max(
          1,
          Math.min(
            Number(pageNumber),
            pdf.numPages
          )
        );


      if (!Number.isFinite(page))
        return;


      currentPage =
        page;


      viewer.scrollTop = 0;
      viewer.scrollLeft = 0;


      renderPage();

    }


    /* =====================================
       BOTONES
       ===================================== */

    prevButton.addEventListener(
      "click",
      () => {

        if (currentPage > 1) {

          goToPage(
            currentPage - 1
          );

        }

      }
    );


    nextButton.addEventListener(
      "click",
      () => {

        if (
          pdf &&
          currentPage < pdf.numPages
        ) {

          goToPage(
            currentPage + 1
          );

        }

      }
    );


    pageInput.addEventListener(
      "change",
      () => {

        goToPage(
          Number(pageInput.value)
        );

      }
    );


    pageInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          pageInput.blur();

          goToPage(
            Number(pageInput.value)
          );

        }

      }
    );


    /* =====================================
       ZOOM
       ===================================== */

    zoomInButton.addEventListener(
      "click",
      () => {

        zoom =
          Math.min(
            3,
            zoom + 0.15
          );


        renderPage();

      }
    );


    zoomOutButton.addEventListener(
      "click",
      () => {

        zoom =
          Math.max(
            0.6,
            zoom - 0.15
          );


        renderPage();

      }
    );


    fitButton.addEventListener(
      "click",
      () => {

        zoom = 1;

        viewer.scrollTop = 0;
        viewer.scrollLeft = 0;

        renderPage();

      }
    );


    /* =====================================
       PANTALLA COMPLETA
       ===================================== */

    fullscreenButton.addEventListener(
      "click",
      async () => {

        try {

          if (!document.fullscreenElement) {

            await document
              .documentElement
              .requestFullscreen();

          } else {

            await document
              .exitFullscreen();

          }

        } catch (error) {

          console.warn(
            "Pantalla completa no disponible",
            error
          );

        }

      }
    );


    document.addEventListener(
      "fullscreenchange",
      () => {

        setTimeout(
          renderPage,
          150
        );

      }
    );


    /* =====================================
       TECLADO
       ===================================== */

    document.addEventListener(
      "keydown",
      event => {

        /*
          Evitamos interferir mientras
          se escribe el número de página.
        */

        if (
          document.activeElement ===
          pageInput
        ) {
          return;
        }


        if (
          event.key === "ArrowRight" ||
          event.key === "PageDown"
        ) {

          if (
            pdf &&
            currentPage < pdf.numPages
          ) {

            goToPage(
              currentPage + 1
            );

          }

        }


        if (
          event.key === "ArrowLeft" ||
          event.key === "PageUp"
        ) {

          if (currentPage > 1) {

            goToPage(
              currentPage - 1
            );

          }

        }

      }
    );


    /* =====================================
       SWIPE EN TELÉFONO
       ===================================== */

    let touchStartX = 0;
    let touchStartY = 0;


    viewer.addEventListener(
      "touchstart",
      event => {

        if (
          event.touches.length !== 1
        ) {
          return;
        }


        touchStartX =
          event.touches[0].clientX;


        touchStartY =
          event.touches[0].clientY;

      },
      {
        passive: true
      }
    );


    viewer.addEventListener(
      "touchend",
      event => {

        if (
          event.changedTouches.length !== 1
        ) {
          return;
        }


        /*
          Cuando existe zoom manual,
          permitimos mover el documento
          y desactivamos el cambio por swipe.
        */

        if (zoom > 1.05)
          return;


        const touchEndX =
          event.changedTouches[0].clientX;


        const touchEndY =
          event.changedTouches[0].clientY;


        const differenceX =
          touchEndX - touchStartX;


        const differenceY =
          touchEndY - touchStartY;


        /*
          Debe ser principalmente
          un movimiento horizontal.
        */

        if (
          Math.abs(differenceX) < 60 ||
          Math.abs(differenceX) <
          Math.abs(differenceY)
        ) {
          return;
        }


        /*
          Deslizar hacia izquierda:
          siguiente página.
        */

        if (
          differenceX < 0 &&
          pdf &&
          currentPage < pdf.numPages
        ) {

          goToPage(
            currentPage + 1
          );

        }


        /*
          Deslizar hacia derecha:
          página anterior.
        */

        if (
          differenceX > 0 &&
          currentPage > 1
        ) {

          goToPage(
            currentPage - 1
          );

        }

      },
      {
        passive: true
      }
    );


    /* =====================================
       REDIMENSIONAR
       ===================================== */

    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            () => {

              if (zoom === 1) {

                renderPage();

              }

            },
            150
          );

      }
    );


    /* =====================================
       CARGAR PDF
       ===================================== */

    async function loadPdf() {

      try {

        loading.classList.remove(
          "hidden"
        );


        error.classList.add(
          "hidden"
        );


        pdf =
          await pdfjsLib
            .getDocument(PDF_URL)
            .promise;


        pageCount.textContent =
          pdf.numPages;


        loading.classList.add(
          "hidden"
        );


        await renderPage();


      } catch (err) {

        console.error(
          "Error cargando PDF:",
          err
        );


        loading.classList.add(
          "hidden"
        );


        error.classList.remove(
          "hidden"
        );

      }

    }


    loadPdf();

  </script>

</body>
</html>
