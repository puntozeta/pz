<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- =========================================
       INFORMACIÓN GENERAL
       ========================================= -->

  <title>El Reloj Sibarita</title>

  <meta
    name="description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo. PUNTOZETA SOLUCIONES DIGITALES"
  >


  <!-- =========================================
       OPEN GRAPH
       ========================================= -->

  <meta
    property="og:title"
    content="El Reloj Sibarita"
  >

  <meta
    property="og:description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo. PUNTOZETA SOLUCIONES DIGITALES"
  >

  <meta
    property="og:image"
    content="https://puntozetasd.wordpress.com/wp-content/uploads/2025/04/sumatrapdf_ooyrdgptzp.png"
  >

  <meta
    property="og:image:alt"
    content="Catálogo de El Reloj Sibarita"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://puntozeta.github.io/pz/elreloj/"
  >


  <!-- =========================================
       TWITTER / X
       ========================================= -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="El Reloj Sibarita"
  >

  <meta
    name="twitter:description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo."
  >

  <meta
    name="twitter:image"
    content="https://puntozetasd.wordpress.com/wp-content/uploads/2025/04/sumatrapdf_ooyrdgptzp.png"
  >


  <!-- =========================================
       FAVICON
       ========================================= -->

  <link
    rel="icon"
    type="image/png"
    href="./assets/elrelojlogo.png"
  >


  <!-- Color de navegador móvil -->

  <meta
    name="theme-color"
    content="#202124"
  >


  <!-- =========================================
       ESTILOS DE LA PÁGINA
       ========================================= -->

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #202124;

    }


    body {

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    }


    /* =========================================
       VISOR
       ========================================= */

    #viewer {

      display: block;

      width: 100%;

      height: 100vh;
      height: 100dvh;

      border: 0;

      background: #202124;

      opacity: 0;

      transition:
        opacity 0.15s ease;

    }


    #viewer.ready {
      opacity: 1;
    }


    /* =========================================
       CARGANDO
       ========================================= */

    #loading {

      position: fixed;

      inset: 0;

      z-index: 1000;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 14px;

      background: #202124;

      color: #ffffff;

      font-size: 14px;

      transition:
        opacity 0.15s ease;

    }


    #loading.hidden {

      opacity: 0;

      pointer-events: none;

    }


    .spinner {

      width: 34px;
      height: 34px;

      border:
        3px solid
        rgba(255, 255, 255, 0.18);

      border-top-color:
        #ffffff;

      border-radius: 50%;

      animation:
        spin 0.7s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }


    /* =========================================
       ERROR
       ========================================= */

    #error {

      position: fixed;

      inset: 0;

      z-index: 2000;

      display: none;

      align-items: center;

      justify-content: center;

      padding: 25px;

      background: #202124;

      color: white;

      text-align: center;

    }


    #error.visible {
      display: flex;
    }


    .error-content {

      max-width: 420px;

    }


    .error-content h2 {

      margin:
        0 0 8px;

      font-size: 18px;

    }


    .error-content p {

      margin: 0;

      color: #bbb;

      font-size: 14px;

      line-height: 1.5;

    }

  </style>

</head>


<body>


  <!-- =========================================
       CARGANDO
       ========================================= -->

  <div id="loading">

    <div class="spinner"></div>

    <span>
      Cargando catálogo...
    </span>

  </div>


  <!-- =========================================
       ERROR
       ========================================= -->

  <div id="error">

    <div class="error-content">

      <h2>
        No se pudo cargar el catálogo
      </h2>

      <p>
        Comprueba tu conexión a Internet
        e inténtalo nuevamente.
      </p>

    </div>

  </div>


  <!-- =========================================
       VISOR PDF
       =========================================

       Importante:

       No ponemos src todavía.

       Primero configuramos el viewer
       y después cargamos el PDF.

       Esto evita mostrar momentáneamente
       la barra de herramientas.
       ========================================= -->

  <pdfjs-viewer-element

    id="viewer"

    iframe-title="Catálogo El Reloj Sibarita"

    zoom="page-width"

    pagemode="none"

    viewer-css-theme="DARK"

  ></pdfjs-viewer-element>


  <!-- =========================================
       COMPONENTE PDF VIEWER
       ========================================= -->

  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/pdfjs-viewer-element@3.2.2/dist/pdfjs-viewer-element.js">
  </script>


  <!-- =========================================
       CONFIGURACIÓN
       ========================================= -->

  <script type="module">

    const PDF_URL =
      "./elreloj.pdf";


    const viewer =
      document.getElementById(
        "viewer"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const error =
      document.getElementById(
        "error"
      );


    /* =========================================
       ESPERAR COMPONENTE
       ========================================= */

    try {

      await customElements.whenDefined(
        "pdfjs-viewer-element"
      );


      /* =======================================
         OCULTAR TODA LA INTERFAZ DE PDF.JS
         =======================================

         Esto se inyecta dentro del iframe
         interno del viewer.

         NO estamos deshabilitando las
         anotaciones ni links.

         Solo estamos ocultando controles.
         ======================================= */

      await viewer.injectViewerStyles(`


        /* =====================================
           TOOLBAR PRINCIPAL
           ===================================== */

        #toolbarContainer,
        .toolbar {

          display: none !important;

        }


        /* =====================================
           SIDEBAR / MINIATURAS
           ===================================== */

        #sidebarContainer {

          display: none !important;

        }


        /* Viewer moderno */

        #viewsManager {

          display: none !important;

        }


        #viewsManagerToggleButton {

          display: none !important;

        }


        /* =====================================
           MENÚ SECUNDARIO
           ===================================== */

        #secondaryToolbar {

          display: none !important;

        }


        #secondaryToolbarToggleButton {

          display: none !important;

        }


        /* =====================================
           BUSCADOR
           ===================================== */

        #findbar {

          display: none !important;

        }


        /* =====================================
           EDITORES
           ===================================== */

        #editorModeButtons,

        #editorHighlight,

        #editorFreeText,

        #editorInk,

        #editorStamp,

        #editorSignature,

        #editorCommentButton {

          display: none !important;

        }


        /* =====================================
           AJUSTAR CONTENEDOR
           =====================================

           Normalmente PDF.js deja un espacio
           arriba para la toolbar.

           Como la quitamos, hacemos que el
           documento utilice toda la pantalla.
           ===================================== */

        #mainContainer {

          top: 0 !important;

          left: 0 !important;

          right: 0 !important;

          bottom: 0 !important;

        }


        #viewerContainer {

          top: 0 !important;

          left: 0 !important;

          right: 0 !important;

          bottom: 0 !important;

        }


        /* =====================================
           FONDO
           ===================================== */

        #viewerContainer {

          background: #202124 !important;

        }


        /* =====================================
           ESPACIO ENTRE PÁGINAS
           ===================================== */

        .pdfViewer .page {

          margin:
            6px auto !important;

        }


        /* Primera página */

        .pdfViewer .page:first-child {

          margin-top:
            6px !important;

        }


        /* =====================================
           EVITAR MENÚS DE EDICIÓN
           ===================================== */

        .editorParamsToolbar,

        .doorHanger,

        .doorHangerRight {

          display: none !important;

        }


        /* =====================================
           LINKS
           =====================================

           IMPORTANTE:

           No ocultamos:

           .annotationLayer
           .linkAnnotation

           porque ahí viven los hipervínculos.
           ===================================== */

        .annotationLayer
        .linkAnnotation > a {

          cursor: pointer !important;

        }


      `);


      /* =======================================
         OPCIONES DEL VIEWER
         ======================================= */

      await viewer.setViewerOptions({

        /*
          Abrir URLs externas
          en una pestaña nueva.

          PDF.js:
          2 = BLANK
        */

        externalLinkTarget: 2,


        /*
          Evitar algunas herramientas
          modernas de edición.
        */

        enableComment: false,

        enableSignatureEditor: false,

        enableHighlightEditor: false

      });


      /* =======================================
         ACCESO AL VIEWER INTERNO
         ======================================= */

      const {
        viewerApp
      } =
        await viewer.initPromise;


      /*
        No necesitamos sidebar.
      */

      try {

        viewerApp.pdfSidebar
          ?.close();

      } catch (_) {}


      /* =======================================
         CARGAR PDF
         ======================================= */

      viewer.setAttribute(
        "src",
        PDF_URL
      );


      /* =======================================
         MOSTRAR VISOR
         ======================================= */

      viewer.classList.add(
        "ready"
      );


      /*
        Dejamos unos milisegundos para que
        PDF.js comience a renderizar antes
        de retirar el loader.
      */

      window.setTimeout(
        () => {

          loading.classList.add(
            "hidden"
          );

        },
        350
      );


      console.log(
        "Visor del catálogo iniciado"
      );


    } catch (err) {

      console.error(
        "Error iniciando visor:",
        err
      );


      loading.classList.add(
        "hidden"
      );


      error.classList.add(
        "visible"
      );

    }

  </script>


</body>

</html>
