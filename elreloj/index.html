<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>El Reloj Sibarita</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #202124;
    }

    pdfjs-viewer-element {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

  </style>

</head>

<body>


  <pdfjs-viewer-element

    src="./elreloj.pdf"

    assets-base="https://cdn.jsdelivr.net/npm/pdfjs-viewer-element@4/dist/"

    zoom="page-width"

    pagemode="none"

    viewer-css-theme="DARK"

    iframe-title="Catálogo El Reloj Sibarita"

  ></pdfjs-viewer-element>


  <script
    type="module"
    src="https://cdn.jsdelivr.net/npm/pdfjs-viewer-element@4/dist/pdfjs-viewer-element.js">
  </script>


</body>

</html>
