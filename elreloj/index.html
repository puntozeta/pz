<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>El Reloj Sibarita</title>

  <style>
    html,
    body,
    #adobe-dc-view {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      overflow: hidden;
    }
  </style>
</head>

<body>

  <div id="adobe-dc-view"></div>

  <script
    src="https://acrobatservices.adobe.com/view-sdk/viewer.js">
  </script>

  <script>
    document.addEventListener(
      "adobe_dc_view_sdk.ready",
      function () {

        const adobeDCView =
          new AdobeDC.View({
            clientId: "TU_CLIENT_ID",
            divId: "adobe-dc-view"
          });


        adobeDCView.previewFile(
          {
            content: {
              location: {
                url: "./elreloj.pdf"
              }
            },

            metaData: {
              fileName:
                "El Reloj Sibarita.pdf"
            }
          },

          {
            embedMode: "FULL_WINDOW",

            showDownloadPDF: false,

            showPrintPDF: false,

            showAnnotationTools: false,

            showLeftHandPanel: false,

            showPageControls: true,

            defaultViewMode:
              "FIT_PAGE"
          }
        );

      }
    );
  </script>

</body>
</html>
