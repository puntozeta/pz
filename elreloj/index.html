  <style>
    :root {
      --toolbar-height: 58px;

      --bg: #252525;
      --toolbar: #111111;

      --toolbar-border:
        rgba(255, 255, 255, 0.08);

      --text: #ffffff;
      --muted: #b5b5b5;

      --button-hover:
        rgba(255, 255, 255, 0.10);

      --button-active:
        rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: var(--bg);

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      color: var(--text);
    }


    /* =====================================
       TOOLBAR
       ===================================== */

    .toolbar {
      height: var(--toolbar-height);

      display: grid;

      grid-template-columns:
        1fr auto 1fr;

      align-items: center;

      padding-left:
        max(
          10px,
          env(safe-area-inset-left)
        );

      padding-right:
        max(
          10px,
          env(safe-area-inset-right)
        );

      background:
        var(--toolbar);

      border-bottom:
        1px solid var(--toolbar-border);

      user-select: none;

      position: relative;

      z-index: 100;
    }

    .toolbar-left,
    .toolbar-center,
    .toolbar-right {
      display: flex;

      align-items: center;

      gap: 4px;

      min-width: 0;
    }

    .toolbar-center {
      justify-content: center;
    }

    .toolbar-right {
      justify-content: flex-end;
    }


    /* =====================================
       MARCA
       ===================================== */

    .brand {
      display: flex;

      align-items: center;

      min-width: 0;
    }

    .brand-name {
      font-size: 14px;

      font-weight: 600;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }


    /* =====================================
       BOTONES
       ===================================== */

    .icon-button {
      width: 42px;
      height: 42px;

      display: inline-flex;

      align-items: center;
      justify-content: center;

      border: 0;

      border-radius: 9px;

      background: transparent;

      color: var(--text);

      cursor: pointer;

      transition:
        background 0.15s ease,
        opacity 0.15s ease;
    }

    .icon-button:hover {
      background:
        var(--button-hover);
    }

    .icon-button:active {
      background:
        var(--button-active);
    }

    .icon-button:disabled {
      opacity: 0.3;

      cursor: default;

      background: transparent;
    }

    .icon-button svg {
      width: 21px;
      height: 21px;

      fill: none;

      stroke: currentColor;

      stroke-width: 1.8;

      stroke-linecap: round;

      stroke-linejoin: round;
    }


    /* =====================================
       NÚMERO DE PÁGINA
       ===================================== */

    .page-control {
      display: flex;

      align-items: center;

      gap: 6px;

      margin: 0 5px;

      color: var(--muted);

      font-size: 13px;
    }

    .page-input {
      width: 44px;
      height: 32px;

      padding: 0 5px;

      border:
        1px solid
        rgba(255,255,255,.13);

      border-radius: 6px;

      background:
        rgba(255,255,255,.07);

      color: white;

      text-align: center;

      font-size: 13px;

      outline: none;

      appearance: textfield;

      -moz-appearance: textfield;
    }

    .page-input::-webkit-inner-spin-button,
    .page-input::-webkit-outer-spin-button {
      display: none;
    }

    .page-input:focus {
      border-color:
        rgba(255,255,255,.35);
    }

    .page-total {
      white-space: nowrap;
    }


    /* =====================================
       VISOR
       ===================================== */

    .viewer {
      position: relative;

      width: 100%;

      height:
        calc(
          100dvh -
          var(--toolbar-height)
        );

      overflow: auto;

      display: flex;

      justify-content: center;

      align-items: flex-start;

      background:
        radial-gradient(
          circle at center,
          #353535 0%,
          #292929 70%
        );

      overscroll-behavior: contain;

      scrollbar-width: thin;
    }

    .canvas-wrapper {
      min-width: 100%;

      min-height: 100%;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 12px;
    }


    /* =====================================
       PÁGINA PDF
       ===================================== */

    .pdf-page {
      position: relative;

      display: inline-block;

      flex: none;

      background: white;

      box-shadow:
        0 8px 30px
        rgba(0,0,0,.32);
    }

    #pdfCanvas {
      display: block;

      background: white;

      transition:
        opacity .12s ease;
    }

    #pdfCanvas.loading {
      opacity: .30;
    }


    /* =====================================
       HIPERVÍNCULOS DEL PDF
       ===================================== */

    .link-layer {
      position: absolute;

      inset: 0;

      z-index: 10;

      pointer-events: none;
    }

    .pdf-link {
      position: absolute;

      display: block;

      padding: 0;

      margin: 0;

      border: 0;

      background: transparent;

      pointer-events: auto;

      cursor: pointer;

      text-decoration: none;

      -webkit-tap-highlight-color:
        rgba(0,0,0,0);
    }

    /*
      Al tocar o pasar el mouse,
      mostramos una indicación muy discreta.
    */

    .pdf-link:active {
      background:
        rgba(0, 100, 255, .08);
    }

    @media (hover: hover) {

      .pdf-link:hover {
        background:
          rgba(0, 100, 255, .06);
      }

    }


    /* =====================================
       CARGA
       ===================================== */

    .loading {
      position: absolute;

      left: 50%;
      top: 50%;

      transform:
        translate(-50%, -50%);

      z-index: 30;

      display: flex;

      flex-direction: column;

      align-items: center;

      gap: 13px;

      color: white;

      font-size: 13px;
    }

    .spinner {
      width: 34px;
      height: 34px;

      border:
        3px solid
        rgba(255,255,255,.18);

      border-top-color:
        white;

      border-radius: 50%;

      animation:
        spin .75s linear infinite;
    }

    @keyframes spin {

      to {
        transform:
          rotate(360deg);
      }

    }

    .hidden {
      display: none !important;
    }


    /* =====================================
       ERROR
       ===================================== */

    .error {
      position: absolute;

      top: 50%;
      left: 50%;

      transform:
        translate(-50%, -50%);

      width:
        min(
          420px,
          calc(100% - 40px)
        );

      z-index: 50;

      padding: 24px;

      text-align: center;

      color: white;

      background:
        rgba(20,20,20,.95);

      border-radius: 12px;

      box-shadow:
        0 12px 40px
        rgba(0,0,0,.35);
    }

    .error h2 {
      margin:
        0 0 8px;

      font-size: 18px;
    }

    .error p {
      margin: 0;

      color: #bbb;

      font-size: 14px;

      line-height: 1.5;
    }


    /* =====================================
       ZOOM
       ===================================== */

    .zoom-label {
      min-width: 52px;

      text-align: center;

      color: var(--muted);

      font-size: 12px;
    }


    /* =====================================
       MÓVIL
       ===================================== */

    @media (max-width: 700px) {

      :root {
        --toolbar-height: 54px;
      }

      .toolbar {
        grid-template-columns:
          auto 1fr auto;

        padding-left: 4px;

        padding-right: 4px;
      }

      .brand-name {
        display: none;
      }

      .toolbar-center {
        justify-content: center;
      }

      .icon-button {
        width: 40px;
        height: 40px;
      }

      .zoom-label,
      .zoom-control {
        display: none;
      }

      .canvas-wrapper {
        padding: 5px;
      }

    }


    @media (max-width: 390px) {

      .fullscreen-button {
        display: none;
      }

      .page-control {
        margin: 0;
      }

      .page-input {
        width: 38px;
      }

    }

  </style>
</head>


<body>

  <!-- =====================================
       TOOLBAR
       ===================================== -->

  <header class="toolbar">

    <div class="toolbar-left">

      <div class="brand">

        <span class="brand-name">
          Catálogo
        </span>

      </div>

    </div>


    <div class="toolbar-center">

      <!-- Anterior -->

      <button
        id="prevButton"
        class="icon-button"
        type="button"
        aria-label="Página anterior"
        title="Página anterior"
      >

        <svg viewBox="0 0 24 24">

          <path
            d="M15 18l-6-6 6-6"

        </svg>

      <!-- Página -->

      <div class="page-control">

      <button

        <svg viewBox="0 0 24 24">

          <path
            d="M9 18l6-6-6-6"
          />

        </svg>

      </button>

    </div>


    <div class="toolbar-right">

      <!-- Alejar -->

      <button
        id="zoomOutButton"
        class="icon-button zoom-control"
        type="button"
        aria-label="Alejar"
        title="Alejar"
      >

        <svg viewBox="0 0 24 24">

          <path
            d="M5 12h14"
          />

        </svg>

      </button>


      <span
        id="zoomLabel"
        class="zoom-label"
      >

      </span>


      <!-- Acercar -->

      <button
        id="zoomInButton"
        class="icon-button zoom-control"

      >

        <svg viewBox="0 0 24 24">

          <path

      <!-- Ajustar -->

      <button

      >

        <svg viewBox="0 0 24 24">

          <path d="M8 3H3v5"/>

          <path d="M16 3h5v5"/>

          <path d="M8 21H3v-5"/>

          <path d="M16 21h5v-5"/>

        </svg>

      </button>


      <!-- Pantalla completa -->

      <button
        id="fullscreenButton"
        class="icon-button fullscreen-button"
        type="button"
        aria-label="Pantalla completa"
        title="Pantalla completa"
      >

        <svg viewBox="0 0 24 24">

          <path d="M8 3H3v5"/>

          <path d="M16 3h5v5"/>

    </div>

  </header>


  <!-- =====================================
       VISOR
       ===================================== -->

  <main
    id="viewer"
    class="viewer"
  >

    <div class="canvas-wrapper">

      <div
        id="pdfPage"
        class="pdf-page"
      >

        <canvas
          id="pdfCanvas"
        ></canvas>


        <!--
          Capa transparente que contendrá
          los hipervínculos.
        -->

        <div
          id="linkLayer"
          class="link-layer"
        ></div>

      </div>

    </div>


    <!-- Cargando -->

    <div
      id="loading"
      class="loading"
    >

      <div
        class="spinner"
      ></div>

      <span>
        Cargando catálogo...
      </span>

    </div>


    <!-- Error -->

    <div
      id="error"
      class="error hidden"
    >

      <h2>
        No se pudo cargar el catálogo
      </h2>

      <p id="errorMessage">
        Comprueba tu conexión a Internet.
      </p>

    </div>

  </main>


  <!-- =====================================
       PDF.JS
       ===================================== -->

  <script type="module">

    /*
      Usamos LEGACY para ofrecer
      compatibilidad con más navegadores
      Android y WebViews.
    */

    import * as pdfjsLib from
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/legacy/build/pdf.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/legacy/build/pdf.worker.mjs";


    /* =====================================
       PDF
       ===================================== */

    const PDF_URL =
      "./elreloj.pdf";


    /* =====================================
       ELEMENTOS
       ===================================== */

    const viewer =
      document.getElementById(
        "viewer"
      );


    const pdfPage =
      document.getElementById(
        "pdfPage"
      );


    const canvas =
      document.getElementById(
        "pdfCanvas"
      );


    const context =
      canvas.getContext(
        "2d"
      );


    const linkLayer =
      document.getElementById(
        "linkLayer"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    const error =
      document.getElementById(
        "error"
      );


    const errorMessage =
      document.getElementById(
        "errorMessage"
      );


    const pageInput =
      document.getElementById(
        "pageInput"
      );


    const pageCount =
      document.getElementById(
        "pageCount"
      );


    const prevButton =
      document.getElementById(
        "prevButton"
      );


    const nextButton =
      document.getElementById(
        "nextButton"
      );


    const zoomInButton =
      document.getElementById(
        "zoomInButton"
      );


    const zoomOutButton =
      document.getElementById(
        "zoomOutButton"
      );


    const zoomLabel =
      document.getElementById(
        "zoomLabel"
      );


    const fitButton =
      document.getElementById(
        "fitButton"
      );


    const fullscreenButton =
      document.getElementById(
        "fullscreenButton"
      );


    /* =====================================
       ESTADO
       ===================================== */

    let pdf = null;

    let currentPage = 1;

    /*
      1 = tamaño automático
    */

    let zoom = 1;

    let renderTask = null;

    let renderVersion = 0;

    let resizeTimer = null;


    /* =====================================
       ESCALA AUTOMÁTICA
       ===================================== */

    function getFitScale(page) {

      const viewport =
        page.getViewport({
          scale: 1
        });


      const availableWidth =
        Math.max(
          100,
          viewer.clientWidth - 12
        );


      const availableHeight =
        Math.max(
          100,
          viewer.clientHeight - 12
        );


      const widthScale =
        availableWidth /
        viewport.width;


      const heightScale =
        availableHeight /
        viewport.height;


      /*
        Muestra la página completa
        dentro de la pantalla.
      */

      return Math.min(
        widthScale,
        heightScale
      );

    }


    /* =====================================
       DESTINOS INTERNOS DEL PDF
       ===================================== */

    async function goToDestination(
      destination
    ) {

      try {

        let dest =
          destination;


        if (
          typeof dest ===
          "string"
        ) {

          dest =
            await pdf.getDestination(
              dest
            );

        }


        if (
          !Array.isArray(dest) ||
          !dest.length
        ) {
          return;
        }


        const pageReference =
          dest[0];


        let pageNumber;


        /*
          Referencia PDF interna.
        */

        if (
          typeof pageReference ===
            "object" &&
          pageReference !== null
        ) {

          const pageIndex =
            await pdf.getPageIndex(
              pageReference
            );


          pageNumber =
            pageIndex + 1;

        }


        /*
          Algunos PDFs usan directamente
          el índice de página.
        */

        else if (
          Number.isInteger(
            pageReference
          )
        ) {

          pageNumber =
            pageReference + 1;

        }


        if (
          Number.isInteger(
            pageNumber
          )
        ) {

          goToPage(
            pageNumber
          );

        }

      } catch (err) {

        console.error(
          "Error abriendo destino interno:",
          err
        );

      }

    }


    /* =====================================
       ACCIONES PDF
       ===================================== */

    function executeNamedAction(
      action
    ) {

      switch (action) {

        case "NextPage":

          goToPage(
            currentPage + 1
          );

          break;


        case "PrevPage":

          goToPage(
            currentPage - 1
          );

          break;


        case "FirstPage":

          goToPage(1);

          break;


        case "LastPage":

          if (pdf) {

            goToPage(
              pdf.numPages
            );

          }

          break;

      }

    }


    /* =====================================
       HIPERVÍNCULOS
       ===================================== */

    async function renderLinks(
      page,
      viewport,
      version
    ) {

      try {

        const annotations =
          await page.getAnnotations({
            intent: "display"
          });


        /*
          Si mientras cargaban las
          anotaciones cambiamos de página,
          descartamos este resultado.
        */

        if (
          version !==
          renderVersion
        ) {
          return;
        }


        linkLayer.innerHTML = "";


        for (
          const annotation
          of annotations
        ) {

          /*
            Solo nos interesan links.
          */

          if (
            annotation.subtype !==
            "Link"
          ) {
            continue;
          }


          if (
            !Array.isArray(
              annotation.rect
            )
          ) {
            continue;
          }


          /*
            Convertimos las coordenadas
            internas del PDF a coordenadas
            CSS del canvas.
          */

          const rectangle =
            viewport
              .convertToViewportRectangle(
                annotation.rect
              );


          const left =
            Math.min(
              rectangle[0],
              rectangle[2]
            );


          const top =
            Math.min(
              rectangle[1],
              rectangle[3]
            );


          const width =
            Math.abs(
              rectangle[0] -
              rectangle[2]
            );


          const height =
            Math.abs(
              rectangle[1] -
              rectangle[3]
            );


          if (
            width < 1 ||
            height < 1
          ) {
            continue;
          }


          let element;


          /* ===============================
             ENLACE EXTERNO
             =============================== */

          if (
            annotation.url ||
            annotation.unsafeUrl
          ) {

            element =
              document.createElement(
                "a"
              );


            element.href =
              annotation.url ||
              annotation.unsafeUrl;


            element.target =
              "_blank";


            element.rel =
              "noopener noreferrer";


            element.setAttribute(
              "aria-label",
              "Abrir enlace"
            );

          }


          /* ===============================
             DESTINO INTERNO
             =============================== */

          else if (
            annotation.dest
          ) {

            element =
              document.createElement(
                "button"
              );


            element.type =
              "button";


            element.setAttribute(
              "aria-label",
              "Ir a otra página del catálogo"
            );


            element.addEventListener(
              "click",
              event => {

                event.preventDefault();

                event.stopPropagation();


                goToDestination(
                  annotation.dest
                );

              }
            );

          }


          /* ===============================
             ACCIÓN
             =============================== */

          else if (
            annotation.action
          ) {

            element =
              document.createElement(
                "button"
              );


            element.type =
              "button";


            element.setAttribute(
              "aria-label",
              "Ejecutar acción"
            );


            element.addEventListener(
              "click",
              event => {

                event.preventDefault();

                event.stopPropagation();


                executeNamedAction(
                  annotation.action
                );

              }
            );

          }


          if (!element) {
            continue;
          }


          element.className =
            "pdf-link";


          element.style.left =
            `${left}px`;


          element.style.top =
            `${top}px`;


          element.style.width =
            `${width}px`;


          element.style.height =
            `${height}px`;


          linkLayer.appendChild(
            element
          );

        }

      } catch (err) {

        console.error(
          "Error cargando hipervínculos:",
          err
        );

      }

    }


    /* =====================================
       RENDERIZAR PÁGINA
       ===================================== */

    async function renderPage() {

      if (!pdf) {
        return;
      }


      const version =
        ++renderVersion;


      try {

        canvas.classList.add(
          "loading"
        );


        /*
          Limpiamos los links de
          la página anterior.
        */

        linkLayer.innerHTML = "";


        /*
          Cancelar render anterior.
        */

        if (renderTask) {

          try {

            renderTask.cancel();

          } catch (_) {}

        }


        const page =
          await pdf.getPage(
            currentPage
          );


        if (
          version !==
          renderVersion
        ) {
          return;
        }


        const fitScale =
          getFitScale(page);


        const finalScale =
          fitScale * zoom;


        const viewport =
          page.getViewport({
            scale: finalScale
          });


        /*
          Tamaño CSS de página.
        */

        pdfPage.style.width =
          `${viewport.width}px`;


        pdfPage.style.height =
          `${viewport.height}px`;


        linkLayer.style.width =
          `${viewport.width}px`;


        linkLayer.style.height =
          `${viewport.height}px`;


        /*
          Retina / HiDPI
        */

        const pixelRatio =
          Math.min(
            window.devicePixelRatio || 1,
            3
          );


        canvas.width =
          Math.floor(
            viewport.width *
            pixelRatio
          );


        canvas.height =
          Math.floor(
            viewport.height *
            pixelRatio
          );


        canvas.style.width =
          `${viewport.width}px`;


        canvas.style.height =
          `${viewport.height}px`;


        const transform =
          pixelRatio !== 1
            ? [
                pixelRatio,
                0,
                0,
                pixelRatio,
                0,
                0
              ]
            : null;


        renderTask =
          page.render({

            canvasContext:
              context,

            viewport,

            transform

          });


        await renderTask.promise;


        if (
          version !==
          renderVersion
        ) {
          return;
        }


        /*
          Renderizar hipervínculos
          después del canvas.
        */

        await renderLinks(
          page,
          viewport,
          version
        );


        canvas.classList.remove(
          "loading"
        );


        pageInput.value =
          currentPage;


        updateControls();


      } catch (err) {

        if (
          err?.name ===
          "RenderingCancelledException"
        ) {
          return;
        }


        console.error(
          "Error renderizando:",
          err
        );

      }

    }


    /* =====================================
       ACTUALIZAR CONTROLES
       ===================================== */

    function updateControls() {

      if (!pdf) {
        return;
      }


      prevButton.disabled =
        currentPage <= 1;


      nextButton.disabled =
        currentPage >=
        pdf.numPages;


      pageInput.max =
        pdf.numPages;


      if (zoom === 1) {

        zoomLabel.textContent =
          "Ajustar";

      }

      else {

        zoomLabel.textContent =
          `${Math.round(
            zoom * 100
          )}%`;

      }

    }


    /* =====================================
       CAMBIAR PÁGINA
       ===================================== */

    function goToPage(
      pageNumber
    ) {

      if (!pdf) {
        return;
      }


      const number =
        Number(pageNumber);


      if (
        !Number.isFinite(number)
      ) {
        return;
      }


      const target =
        Math.max(
          1,
          Math.min(
            Math.round(number),
            pdf.numPages
          )
        );


      currentPage =
        target;


      viewer.scrollTop = 0;

      viewer.scrollLeft = 0;


      renderPage();

    }


    /* =====================================
       ANTERIOR / SIGUIENTE
       ===================================== */

    prevButton.addEventListener(
      "click",
      () => {

        if (
          currentPage > 1
        ) {

          goToPage(
            currentPage - 1
          );

        }

      }
    );


    nextButton.addEventListener(
      "click",
      () => {

        if (
          pdf &&
          currentPage <
          pdf.numPages
        ) {

          goToPage(
            currentPage + 1
          );

        }

      }
    );


    /* =====================================
       INPUT DE PÁGINA
       ===================================== */

    pageInput.addEventListener(
      "change",
      () => {

        goToPage(
          pageInput.value
        );

      }
    );


    pageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
          "Enter"
        ) {

          pageInput.blur();

          goToPage(
            pageInput.value
          );

        }

      }
    );


    /* =====================================
       ZOOM
       ===================================== */

    zoomInButton.addEventListener(
      "click",
      () => {

        zoom =
          Math.min(
            3,
            zoom + .15
          );


        renderPage();

      }
    );


    zoomOutButton.addEventListener(
      "click",
      () => {

        zoom =
          Math.max(
            .6,
            zoom - .15
          );


        renderPage();

      }
    );


    fitButton.addEventListener(
      "click",
      () => {

        zoom = 1;


        viewer.scrollTop = 0;

        viewer.scrollLeft = 0;


        renderPage();

      }
    );


    /* =====================================
       PANTALLA COMPLETA
       ===================================== */

    fullscreenButton.addEventListener(
      "click",
      async () => {

        try {

          if (
            !document.fullscreenElement
          ) {

            await document
              .documentElement
              .requestFullscreen();

          }

          else {

            await document
              .exitFullscreen();

          }

        } catch (err) {

          console.warn(
            "Pantalla completa no disponible:",
            err
          );

        }

      }
    );


    document.addEventListener(
      "fullscreenchange",
      () => {

        setTimeout(
          renderPage,
          150
        );

      }
    );


    /* =====================================
       TECLADO
       ===================================== */

    document.addEventListener(
      "keydown",
      event => {

        if (
          document.activeElement ===
          pageInput
        ) {
          return;
        }


        if (
          event.key ===
            "ArrowRight" ||
          event.key ===
            "PageDown"
        ) {

          if (
            pdf &&
            currentPage <
            pdf.numPages
          ) {

            goToPage(
              currentPage + 1
            );

          }

        }


        if (
          event.key ===
            "ArrowLeft" ||
          event.key ===
            "PageUp"
        ) {

          if (
            currentPage > 1
          ) {

            goToPage(
              currentPage - 1
            );

          }

        }

      }
    );


    /* =====================================
       SWIPE MÓVIL
       ===================================== */

    let touchStartX = 0;

    let touchStartY = 0;

    let touchStartedOnLink =
      false;


    viewer.addEventListener(
      "touchstart",
      event => {

        if (
          event.touches.length !== 1
        ) {
          return;
        }


        touchStartedOnLink =
          Boolean(
            event.target.closest(
              ".pdf-link"
            )
          );


        touchStartX =
          event
            .touches[0]
            .clientX;


        touchStartY =
          event
            .touches[0]
            .clientY;

      },
      {
        passive: true
      }
    );


    viewer.addEventListener(
      "touchend",
      event => {

        /*
          Si empezamos tocando un
          hipervínculo, no ejecutamos swipe.
        */

        if (
          touchStartedOnLink
        ) {

          touchStartedOnLink =
            false;

          return;

        }


        if (
          event.changedTouches.length
          !== 1
        ) {
          return;
        }


        /*
          Con zoom permitimos mover
          libremente el documento.
        */

        if (
          zoom > 1.05
        ) {
          return;
        }


        const touchEndX =
          event
            .changedTouches[0]
            .clientX;


        const touchEndY =
          event
            .changedTouches[0]
            .clientY;


        const differenceX =
          touchEndX -
          touchStartX;


        const differenceY =
          touchEndY -
          touchStartY;


        /*
          Movimiento horizontal mínimo.
        */

        if (
          Math.abs(
            differenceX
          ) < 60
          ||
          Math.abs(
            differenceX
          ) <
          Math.abs(
            differenceY
          )
        ) {
          return;
        }


        /*
          Swipe hacia izquierda.
        */

        if (
          differenceX < 0 &&
          pdf &&
          currentPage <
          pdf.numPages
        ) {

          goToPage(
            currentPage + 1
          );

        }


        /*
          Swipe hacia derecha.
        */

        if (
          differenceX > 0 &&
          currentPage > 1
        ) {

          goToPage(
            currentPage - 1
          );

        }

      },
      {
        passive: true
      }
    );


    /* =====================================
       CAMBIOS DE TAMAÑO
       ===================================== */

    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            () => {

              if (
                zoom === 1
              ) {

                renderPage();

              }

            },
            180
          );

      }
    );


    /* =====================================
       CARGAR PDF
       ===================================== */

    async function loadPdf() {

      try {

        loading.classList.remove(
          "hidden"
        );


        error.classList.add(
          "hidden"
        );


        const absolutePdfUrl =
          new URL(
            PDF_URL,
            document.baseURI
          ).href;


        console.log(
          "Cargando PDF:",
          absolutePdfUrl
        );


        /*
          Descargamos primero el archivo.
          Esto también permite mostrar
          errores HTTP más claros.
        */

        const response =
          await fetch(
            absolutePdfUrl,
            {
              cache: "default"
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            `Error HTTP ${response.status}`
          );

        }


        const contentType =
          response.headers.get(
            "content-type"
          );


        console.log(
          "Tipo:",
          contentType
        );


        const pdfData =
          await response.arrayBuffer();


        if (
          !pdfData ||
          pdfData.byteLength < 100
        ) {

          throw new Error(
            "El archivo PDF está vacío"
          );

        }


        pdf =
          await pdfjsLib
            .getDocument({
              data: pdfData
            })
            .promise;


        pageCount.textContent =
          pdf.numPages;


        pageInput.max =
          pdf.numPages;


        loading.classList.add(
          "hidden"
        );


        await renderPage();


      } catch (err) {

        console.error(
          "Error cargando PDF:",
          err
        );


        loading.classList.add(
          "hidden"
        );


        error.classList.remove(
          "hidden"
        );


        errorMessage.textContent =
          "No se pudo cargar el catálogo: " +
          (
            err?.message ||
            "error desconocido"
          );

      }

    }


    /* =====================================
       INICIAR
       ===================================== */

    loadPdf();

  </script>
