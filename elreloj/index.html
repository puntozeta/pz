  >

  <meta

    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo."
  >

  <meta
    name="twitter:image"
    content="https://puntozetasd.wordpress.com/wp-content/uploads/2025/04/sumatrapdf_ooyrdgptzp.png"
  >

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="./assets/elrelojlogo.png"
  >

  <meta
    name="theme-color"
    content="#1f1f1f"
  >


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #1f1f1f;

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    }


    /*
      El visor utiliza toda la pantalla.
    */

    #pdf-viewer {

      width: 100%;

      height: 100vh;
      height: 100dvh;

      opacity: 0;

      transition:
        opacity .15s ease;

    }


    #pdf-viewer.ready {

      opacity: 1;

    }


    /*
      Pantalla inicial de carga.
    */

    #loading {

      position: fixed;

      inset: 0;

      z-index: 1000;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      gap: 14px;

      background: #1f1f1f;

      color: #fff;

      font-size: 14px;

    }


    #loading.hidden {

      display: none;

    }


    .spinner {

      width: 34px;
      height: 34px;

      border:
        3px solid
        rgba(255,255,255,.2);

      border-top-color:
        white;

      border-radius: 50%;

      animation:
        spin .7s linear infinite;

    }


    @keyframes spin {

      to {
        transform: rotate(360deg);
      }

    }

  </style>

</head>


<body>


  <!-- ================================
       CARGANDO
       ================================ -->

  <div id="loading">

    <div class="spinner"></div>

    <span>
      Cargando catálogo...
    </span>

  </div>


  <!-- ================================
       VISOR
       ================================ -->

  <div id="pdf-viewer"></div>


  <!-- ================================
       EMBEDPDF
       ================================ -->

  <script type="module">

    import EmbedPDF, { ZoomMode } from
      "https://cdn.jsdelivr.net/npm/@embedpdf/snippet@2.15.1/dist/embedpdf.js";


    const pdfViewer =
      document.getElementById(
        "pdf-viewer"
      );


    const loading =
      document.getElementById(
        "loading"
      );


    /* =================================
       CREAR VISOR
       ================================= */

    const viewer =
      EmbedPDF.init({

        type: "container",

        target:
          pdfViewer,

        src:
          "./elreloj.pdf",


        /*
          No mostrar pestañas de documentos.
        */

        tabBar:
          "never",


        /*
          Tema oscuro.
        */

        theme: {

          preference:
            "dark"

        },


        /*
          Ajustamos cada página
          al ancho de pantalla.
        */

        zoom: {

          defaultZoomLevel:
            ZoomMode.FitWidth,

          minZoom:
            0.5,

          maxZoom:
            3

        },


        /*
          Catálogo continuo vertical.
        */

        scroll: {

          defaultStrategy:
            "vertical",

          defaultPageGap:
            8

        },


        /*
          No necesitamos herramienta
          de arrastre activa por defecto.
        */

        pan: {

          defaultMode:
            "never"

        },


        /*
          PDF en modo lectura.

          modifyAnnotations false impide
          modificar o eliminar anotaciones.

          Los enlaces existentes siguen
          formando parte del documento.
        */

        permissions: {

          overrides: {

            print:
              false,

            printHighQuality:
              false,

            modifyContents:
              false,

            modifyAnnotations:
              false,

            fillForms:
              false

          }

        },


        /*
          Deshabilitamos toda la UI
          que no necesitamos.

          IMPORTANTE:
          NO ponemos "annotation",
          porque los hipervínculos del
          PDF dependen de esa infraestructura.
        */

        disabledCategories: [

          /* Edición de anotaciones */

          "annotation-markup",

          "annotation-highlight",

          "annotation-underline",

          "annotation-strikeout",

          "annotation-squiggly",

          "annotation-ink",

          "annotation-text",

          "annotation-stamp",

          "annotation-shape",

          "annotation-rectangle",

          "annotation-circle",

          "annotation-line",

          "annotation-arrow",

          "annotation-polygon",

          "annotation-polyline",


          /* Formularios */

          "form",


          /* Redacción */

          "redaction",


          /* Insertar elementos */

          "insert",


          /* Historial */

          "history",


          /* Paneles */

          "panel",


          /* Vista doble */

          "spread",


          /* Rotación */

          "rotate",


          /* Capturas */

          "capture",


          /* Abrir / cerrar documentos */

          "document-open",

          "document-close",


          /* Impresión */

          "document-print",


          /* Exportar / descargar */

          "document-export",


          /* Pantalla completa propia */

          "document-fullscreen",


          /* Protección */

          "document-protect",


          /* Seguridad visual */

          "security",


          /* Herramientas especiales */

          "zoom-marquee"

        ]

      });


    /* =================================
       PERSONALIZAR UI
       ================================= */

    async function configureViewer() {

      try {

        const registry =
          await viewer.registry;


        const ui =
          registry
            .getPlugin("ui")
            ?.provides();


        /*
          Dejamos la toolbar completamente
          vacía.

          Así desaparecen:
          menú, View, +, búsqueda, etc.
        */

        if (ui) {

          const schema =
            ui.getSchema();


          const toolbar =
            schema
              .toolbars
              ?.
              ["main-toolbar"];


          if (toolbar) {

            ui.mergeSchema({

              toolbars: {

                "main-toolbar": {

                  ...toolbar,

                  items: []

                }

              }

            });

          }

        }


        /*
          Dejamos Annotation en cursor
          normal para poder interactuar
          con links existentes.
        */

        const annotation =
          registry
            .getPlugin("annotation")
            ?.provides();


        if (annotation) {

          annotation.setActiveTool(
            null
          );

        }


        /*
          Mostrar visor solamente después
          de haber quitado la toolbar.
        */

        pdfViewer.classList.add(
          "ready"
        );


        loading.classList.add(
          "hidden"
        );


      } catch (err) {

        console.error(
          "Error configurando visor:",
          err
        );


        pdfViewer.classList.add(
          "ready"
        );


        loading.classList.add(
          "hidden"
        );

      }

    }


    configureViewer();


    /* =================================
       ABRIR LINKS AUTOMÁTICAMENTE
       =================================

       EmbedPDF v2 selecciona primero la
       anotación y muestra "Go to Link".

       Este código detecta esa opción y la
       ejecuta inmediatamente para que:

       tocar enlace
            ↓
       abrir URL

       sin intervención adicional.
       ================================= */


    let linkInteractionActive =
      false;


    pdfViewer.addEventListener(
      "pointerup",
      () => {

        linkInteractionActive =
          true;


        /*
          Ventana temporal suficiente para
          que EmbedPDF cree su menú.
        */

        window.setTimeout(
          () => {

            linkInteractionActive =
              false;

          },
          1000
        );

      },
      true
    );


    /*
      Buscar también dentro de Shadow DOM
      en caso de que EmbedPDF lo utilice.
    */

    function getSearchRoots() {

      const roots =
        [document];


      const walk =
        root => {

          const elements =
            root.querySelectorAll
              ? root.querySelectorAll("*")
              : [];


          for (
            const element
            of elements
          ) {

            if (
              element.shadowRoot
            ) {

              roots.push(
                element.shadowRoot
              );


              walk(
                element.shadowRoot
              );

            }

          }

        };


      walk(document);


      return roots;

    }


    function normalizeText(
      element
    ) {

      return (
        element?.textContent ||
        ""
      )
        .trim()
        .replace(
          /\s+/g,
          " "
        )
        .toLowerCase();

    }


    function executeGoToLink() {

      if (
        !linkInteractionActive
      ) {

        return;

      }


      const roots =
        getSearchRoots();


      for (
        const root
        of roots
      ) {

        const elements =
          root.querySelectorAll(
            [
              "button",
              "[role='button']",
              "[role='menuitem']"
            ].join(",")
          );


        for (
          const element
          of elements
        ) {

          const text =
            normalizeText(
              element
            );


          const isLinkCommand =
            text.includes(
              "go to link"
            )
            ||
            text.includes(
              "ir al enlace"
            )
            ||
            text.includes(
              "abrir enlace"
            );


          if (
            !isLinkCommand
          ) {

            continue;

          }


          /*
            Evitar ejecución duplicada.
          */

          if (
            element.dataset
              .autoLinkExecuted ===
            "true"
          ) {

            continue;

          }


          element.dataset
            .autoLinkExecuted =
            "true";


          /*
            Ocultamos el menú antes de
            ejecutar el enlace.
          */

          const menu =
            element.closest(
              "[role='menu']"
            )
            ||
            element.parentElement;


          if (menu) {

            menu.style.visibility =
              "hidden";

          }


          linkInteractionActive =
            false;


          /*
            Ejecutar acción nativa
            de EmbedPDF.
          */

          element.click();


          return;

        }

      }

    }


    /*
      EmbedPDF crea el menú de enlace
      dinámicamente.
    */

    const observer =
      new MutationObserver(
        () => {

          executeGoToLink();

        }
      );


    observer.observe(
      document.documentElement,
      {

        childList:
          true,

        subtree:
          true

      }
    );

  </script>


</body>

</html>
