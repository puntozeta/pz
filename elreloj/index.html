<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <!-- =====================================
       INFORMACIÓN GENERAL
       ===================================== -->

  <title>El Reloj Sibarita</title>

  <meta
    name="description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo. PUNTOZETA SOLUCIONES DIGITALES"
  >


  <!-- =====================================
       OPEN GRAPH
       ===================================== -->

  <meta
    property="og:title"
    content="El Reloj Sibarita"
  >

  <meta
    property="og:description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo. PUNTOZETA SOLUCIONES DIGITALES"
  >

  <meta
    property="og:image"
    content="https://puntozetasd.wordpress.com/wp-content/uploads/2025/04/sumatrapdf_ooyrdgptzp.png"
  >

  <meta
    property="og:image:alt"
    content="Catálogo de El Reloj Sibarita"
  >

  <meta
    property="og:type"
    content="website"
  >

  <meta
    property="og:url"
    content="https://puntozeta.github.io/pz/elreloj/"
  >


  <!-- =====================================
       TWITTER / X
       ===================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="El Reloj Sibarita"
  >

  <meta
    name="twitter:description"
    content="PRODUCTOS DE LA MIXTECA OAXAQUEÑA. Venta de chocolate artesanal semiamargo."
  >

  <meta
    name="twitter:image"
    content="https://puntozetasd.wordpress.com/wp-content/uploads/2025/04/sumatrapdf_ooyrdgptzp.png"
  >


  <!-- =====================================
       FAVICON
       ===================================== -->

  <link
    rel="icon"
    type="image/png"
    href="./assets/elrelojlogo.png"
  >


  <meta
    name="theme-color"
    content="#111111"
  >


  <!-- =====================================
       ESTILOS
       ===================================== -->

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;

      width: 100%;

      height: 100%;

      background: #1f1f1f;

      overflow: hidden;

    }


    body {

      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    }


    /*
      El visor ocupa prácticamente
      toda la pantalla disponible.
    */

    #pdf-viewer {

      width: 100%;

      height: 100vh;
      height: 100dvh;

    }


    /*
      Fallback por si JavaScript tarda
      unos instantes en inicializar.
    */

    .loading {

      position: fixed;

      inset: 0;

      display: flex;

      align-items: center;

      justify-content: center;

      background: #1f1f1f;

      color: #fff;

      font-size: 14px;

      z-index: -1;

    }

  </style>

</head>


<body>


  <!-- =====================================
       FALLBACK DE CARGA
       ===================================== -->

  <div class="loading">
    Cargando catálogo...
  </div>


  <!-- =====================================
       VISOR
       ===================================== -->

  <div id="pdf-viewer"></div>


  <!-- =====================================
       EMBEDPDF
       ===================================== -->

  <script type="module">

    import EmbedPDF from
      "https://cdn.jsdelivr.net/npm/@embedpdf/snippet@2/dist/embedpdf.js";


    /*
      Inicializamos el visor.

      El PDF está junto al index.html,
      por lo tanto usamos:

      ./elreloj.pdf
    */

    const viewer =
      EmbedPDF.init({

        type: "container",

        target:
          document.getElementById(
            "pdf-viewer"
          ),

        src:
          "./elreloj.pdf",


        /*
          Tema.

          Puedes cambiar "dark" por:

          "light"
          "system"
        */

        theme: {
          preference: "dark"
        },


        /*
          No necesitamos pestañas porque
          solamente mostramos un catálogo.
        */

        tabBar: "never",


        /*
          Quitamos herramientas innecesarias
          para un catálogo.

          export:
          elimina la funcionalidad de
          exportar/descargar desde la UI.

          print:
          elimina impresión.

          annotation:
          elimina herramientas para dibujar,
          resaltar, agregar notas, etc.

          redaction:
          elimina herramientas de censura.

          insert:
          elimina inserción de imágenes,
          firmas, etc.
        */

        disabledCategories: [

          "annotation",

          "print",

          "export",

          "redaction",

          "insert"

        ]

      });


    /*
      Opcional:

      Esto solamente confirma en consola
      que EmbedPDF inició correctamente.
    */

    viewer.registry
      .then(() => {

        console.log(
          "Catálogo cargado con EmbedPDF"
        );

      })
      .catch(error => {

        console.error(
          "Error iniciando EmbedPDF:",
          error
        );

      });

  </script>


</body>

</html>
